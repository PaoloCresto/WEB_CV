<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Hanken Grotesk -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#6d28d9',
              orange: '#f97316',
            },
            surface: '#f8f9ff',
            'surface-dim': '#d0dbed',
          },
          fontFamily: {
            sans: ['Hanken Grotesk', 'sans-serif'],
          },
          animation: {
            'slow-spin': 'spin 20s linear infinite',
            'pulse-subtle': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',

<style data-purpose="layout-styles">
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #6d28d9 0%, #1e1b4b 100%);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Custom button sizing and interaction */
    .hero-logo-button {
      width: clamp(150px, 20vw, 220px);
      height: clamp(150px, 20vw, 220px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .hero-logo-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(249, 115, 22, 0.4);
    }

    /* Radial Menu Positioning */
    .menu-container {
      position: relative;
      width: clamp(300px, 80vw, 650px);
      height: clamp(300px, 80vw, 650px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-item-hidden {
      position: absolute;
      left: 50%;
      top: 50%;
      margin-left: -48px; /* half of w-24 */
      margin-top: -60px; /* adjustment for icon + text */
      opacity: 0;
      transform: translate(0, 0) scale(0.5);
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 5;
    }

    /* Radial math: 6 items, 60 degrees apart */
    /* Radius is roughly 40-45% of container */
    .menu-item-visible:nth-child(1) { transform: translate(0, -180px) scale(1); opacity: 1; pointer-events: auto; }
    .menu-item-visible:nth-child(2) { transform: translate(156px, -90px) scale(1); opacity: 1; pointer-events: auto; }
    .menu-item-visible:nth-child(3) { transform: translate(156px, 90px) scale(1); opacity: 1; pointer-events: auto; }
    .menu-item-visible:nth-child(4) { transform: translate(0, 180px) scale(1); opacity: 1; pointer-events: auto; }
    .menu-item-visible:nth-child(5) { transform: translate(-156px, 90px) scale(1); opacity: 1; pointer-events: auto; }
    .menu-item-visible:nth-child(6) { transform: translate(-156px, -90px) scale(1); opacity: 1; pointer-events: auto; }

    @media (max-width: 640px) {
      .menu-item-visible:nth-child(1) { transform: translate(0, -130px) scale(0.85); }
      .menu-item-visible:nth-child(2) { transform: translate(110px, -65px) scale(0.85); }
      .menu-item-visible:nth-child(3) { transform: translate(110px, 65px) scale(0.85); }
      .menu-item-visible:nth-child(4) { transform: translate(0, 130px) scale(0.85); }
      .menu-item-visible:nth-child(5) { transform: translate(-110px, 65px) scale(0.85); }
      .menu-item-visible:nth-child(6) { transform: translate(-110px, -65px) scale(0.85); }
    }

    /* Tooltip styling */
    .discover-hint {
      transition: opacity 0.3s ease;
    }
  </style>
</head>

<!-- JavaScript for interaction feedback -->
<script data-purpose="interaction-logic">
    const ctaButton = document.getElementById('main-cta-button');
    const menuItems = document.querySelectorAll('.menu-item-hidden');
    const clickHint = document.getElementById('click-hint');
    let isOpen = false;

    ctaButton.addEventListener('click', () => {
      isOpen = !isOpen;
      
      menuItems.forEach((item) => {
        if (isOpen) {
          item.classList.add('menu-item-visible');
          clickHint.style.opacity = '0';
        } else {
          item.classList.remove('menu-item-visible');
          clickHint.style.opacity = '1';
        }
      });
      
      const logoImg = ctaButton.querySelector('img');
      if (isOpen) {
        logoImg.style.transform = 'rotate(180deg) scale(0.8)';
      } else {
        logoImg.style.transform = '';
      }
    });
  </script>
