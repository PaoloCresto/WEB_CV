<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Hanken Grotesk -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols for Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#6d28d9',
              orange: '#f97316',
            },
            surface: '#f8f9ff',
            'surface-dim': '#d0dbed',
          },
          fontFamily: {
            sans: ['Hanken Grotesk', 'sans-serif'],
          },
          animation: {
            'slow-spin': 'spin 20s linear infinite',
            'pulse-subtle': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',

<style data-purpose="layout-styles">
    body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Clean landing page experience - No scroll per request */
      background: radial-gradient(circle at center, #6d28d9 0%, #1e1b4b 100%);
      height: 100vh;
    }

    /* Custom button sizing and interaction */
    .hero-logo-button {
      width: clamp(140px, 18vw, 220px);
      height: clamp(140px, 18vw, 220px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .hero-logo-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(249, 115, 22, 0.4);
    }

    /* Radial Menu Styles */
    .radial-item {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
      z-index: 5;
    }

    .menu-open .radial-item {
      opacity: 1;
      transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(1);
      pointer-events: auto;
    }

    /* Tooltip styling for menu labels */
    .radial-label {
      position: absolute;
      top: 110%;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-weight: 600;
    }

    .radial-item:hover .radial-label {
      opacity: 1;
    }

    /* Modal Overlay Styles */
    #content-overlay {
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #content-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    #content-overlay.hidden-state {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body class="h-full text-white font-sans flex flex-col items-center justify-center overflow-hidden">
<!-- BEGIN: MainHeroContent -->

</div>
<!-- Center Interaction: Logo & Radial Menu -->

<!-- Radial Buttons -->
<!-- Home -->

</button>
<span class="radial-label">Home</span>
</div>
<!-- La mia storia -->
<div class="radial-item group" data-index="1" style="--tw-translate-x: 173px; --tw-translate-y: -100px; transition-delay: 0.05s;">
<button class="w-14 h-14 md:w-16 md:h-16 bg-brand-orange rounded-full flex items-center justify-center shadow-lg hover:bg-white hover:text-brand-orange transition-all duration-300" onclick="openModal('storia')">
<span class="material-symbols-outlined !text-2xl md:!text-3xl">person</span>
</button>
<span class="radial-label">La mia storia</span>
</div>
<!-- Competenze -->
<div class="radial-item group" data-index="2" style="--tw-translate-x: 173px; --tw-translate-y: 100px; transition-delay: 0.1s;">

</div>
<!-- Contatti -->
<div class="radial-item group" data-index="5" style="--tw-translate-x: -173px; --tw-translate-y: -100px; transition-delay: 0.25s;">
<button class="w-14 h-14 md:w-16 md:h-16 bg-brand-orange rounded-full flex items-center justify-center shadow-lg hover:bg-white hover:text-brand-orange transition-all duration-300" onclick="openModal('contatti')">

<!-- BEGIN: Content Modal Overlay -->

<!-- JavaScript for Radial Menu and Modal Logic -->
<script data-purpose="interaction-logic">
  const menuBtn = document.getElementById('main-cta-button');
  const container = document.getElementById('menu-container');
  const instructionLabel = document.getElementById('instruction-label');
  const items = document.querySelectorAll('.radial-item');
  const overlay = document.getElementById('content-overlay');
  const modalTitle = document.getElementById('modal-title');
  const modalText = document.getElementById('modal-text');
  
  let isOpen = false;

  // Content Data
  const sectionContent = {
    home: {
      title: 'Home',
      text: 'Benvenuti nella mia Home. Sono un Graphic e Web Designer focalizzato sulla creazione di esperienze digitali memorabili e identità visive uniche.'
    },
    storia: {
      title: 'La mia storia',
      text: 'Il mio percorso inizia con una passione per il visual design e l\'informatica. Negli anni ho affinato il mio occhio critico collaborando con diverse agenzie e clienti internazionali.'
    },
    competenze: {
      title: 'Competenze',
      text: 'Dall\'Adobe Creative Suite al frontend development con React e Tailwind. Unisco design thinking e competenze tecniche per risolvere problemi complessi.'
    },
    esperienze: {
      title: 'Esperienze',
      text: 'Anni di esperienza come freelancer e in-house designer. Ho gestito progetti che spaziano dal branding aziendale allo sviluppo di interfacce utente scalabili.'
    },
    progetti: {
      title: 'Progetti',
      text: 'Una selezione di lavori che rappresentano la mia filosofia progettuale: minimalismo, funzionalità e un pizzico di innovazione tecnologica.'
    },
    contatti: {
      title: 'Contatti',
      text: 'Sei interessato a collaborare o vuoi semplicemente fare due chiacchiere? Scrivimi a contact@paolocresto.com o connettiti sui social.'
    }
  };

  // Configuration for radial layout
  const radius = window.innerWidth < 768 ? 140 : 200; // Radius in pixels
  const totalItems = items.length;

  // Initialize button positions
  items.forEach((item, index) => {
    const angle = (index / totalItems) * 2 * Math.PI - (Math.PI / 2); // Start from top
    const x = Math.round(Math.cos(angle) * radius);
    const y = Math.round(Math.sin(angle) * radius);
    
    // Set custom CSS properties for translation
    item.style.setProperty('--tw-translate-x', `${x}px`);
    item.style.setProperty('--tw-translate-y', `${y}px`);
    
    // Stagger delay
    item.style.transitionDelay = `${index * 0.05}s`;
  });

  menuBtn.addEventListener('click', () => {
    isOpen = !isOpen;
    
    if (isOpen) {
      container.classList.add('menu-open');
      instructionLabel.innerText = 'explore the menu';
      instructionLabel.classList.remove('animate-pulse-subtle');
    } else {
      container.classList.remove('menu-open');
      instructionLabel.innerText = 'click to discover';
      instructionLabel.classList.add('animate-pulse-subtle');
    }
  });

  function openModal(section) {
    const content = sectionContent[section];
    if (content) {
      modalTitle.innerText = content.title;
      modalText.innerText = content.text;
      overlay.classList.remove('hidden-state');
      overlay.classList.add('active');
    }
  }

  function closeModal() {
    overlay.classList.remove('active');
    setTimeout(() => {
      overlay.classList.add('hidden-state');
    }, 400);
  }

  // Handle window resize for radius adjustments
  window.addEventListener('resize', () => {
    const newRadius = window.innerWidth < 768 ? 140 : 200;
    items.forEach((item, index) => {
      const angle = (index / totalItems) * 2 * Math.PI - (Math.PI / 2);
      const x = Math.round(Math.cos(angle) * newRadius);
      const y = Math.round(Math.sin(angle) * newRadius);
      item.style.setProperty('--tw-translate-x', `${x}px`);
      item.style.setProperty('--tw-translate-y', `${y}px`);
    });
  });
</script>
</body></html>
