<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Paolo Cresto - Interactive CV</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            theme: {
                extend: {
                    "colors": {

                        "primary-fixed": "#e2e2e2",
                        "on-secondary-fixed": "#1b1c1c",
                        "tertiary": "#000000",
                        "on-primary-container": "#848484",
                        "secondary-fixed-dim": "#c7c6c6",
                        "outline-variant": "#cfc4c5",
                        "surface-variant": "#e2e2e2",
                        "primary": "#000000",
                        "surface-bright": "#f9f9f9",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#eeeeee",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#1b1b1b",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#848484",
                        "surface-dim": "#dadada",
                        "outline": "#7e7576",
                        "on-secondary-container": "#626262",
                        "inverse-primary": "#c6c6c6",
                        "inverse-on-surface": "#f1f1f1",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#5e5e5e",
                        "background": "#f9f9f9",
                        "primary-fixed-dim": "#c6c6c6",
                        "on-tertiary-fixed-variant": "#474747",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#1b1b1b",
                        "on-background": "#1a1c1c",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-fixed-variant": "#464747",
                        "on-secondary": "#ffffff",
                        "secondary": "#5e5e5e",
                        "surface-container-high": "#e8e8e8",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#4c4546",
                        "on-primary-fixed-variant": "#474747",
                        "secondary-container": "#e1dfdf",
                        "surface": "#f9f9f9",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "surface-container-low": "#f3f3f3",
                        "tertiary-fixed": "#e2e2e2",
                        "inverse-surface": "#2f3131",
                        "secondary-fixed": "#e4e2e2",
                        "on-surface": "#1a1c1c",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",

                    "spacing": {

                        "container-max-width": "720px",
                        "section-gap": "8rem",
                        "gutter": "16px",
                        "element-gap": "2rem"
                    },
                    "fontFamily": {
                        "display-name": ["Hanken Grotesk"],
                        "mono-technical": ["Geist"],
                        "label-caps": ["Geist"],

                        "body-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "display-name": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "mono-technical": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-name-mobile": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes subtle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .float-animation {
            animation: subtle-float 6s ease-in-out infinite;
        }
        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .pulse-text {
            animation: pulse-opacity 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-surface-container-lowest">
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative w-full px-margin-mobile md:px-0">
<div class="max-w-[720px] w-full flex flex-col items-center justify-center text-center space-y-element-gap z-10">
<!-- Headline -->
<h1 class="font-display-name-mobile text-display-name-mobile md:font-display-name md:text-display-name text-primary tracking-tight transition-all duration-700 ease-out translate-y-4 opacity-0" id="hero-name">
                PAOLO CRESTO
            </h1>
<!-- Interactive Logo Button -->
<button aria-label="Enter Interactive CV" class="group relative outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-4 focus-visible:ring-offset-background rounded-full transition-transform duration-500 hover:scale-105 active:scale-95 float-animation opacity-0 translate-y-4" id="hero-logo" onclick="window.location.href='#explore'">
<!-- Subtle glow effect -->
<div class="absolute inset-0 rounded-full bg-surface-container-high blur-xl opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="relative w-48 h-48 md:w-64 md:h-64 rounded-full overflow-hidden border border-surface-container shadow-[0_4px_20px_rgba(0,0,0,0.05)] group-hover:shadow-[0_8px_30px_rgba(0,0,0,0.1)] transition-shadow duration-500 bg-surface">
<img alt="Paolo Cresto Logo" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700 ease-in-out" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB92GDo0ZjQp5rb_jJhRB_y6hWylieHJIYgWpe2wZnXJXuMCWT4SFN7i4qjnMxgZFYfIN_7U33OVmNiq8xDeqtIhrRLrG1SayLQ_ugqk-z7VYGf6lgbOdE6ZOJoXQHbL9tCfPqAb4PTTTzuOYeHd4OIcel2aGSYTE5rXlPy3IiCnOfH9cq_t0tFzQSv9O3tVYIgrsq7INVpHwCCgXy7XnRiU35QhDOBx-6kZ5wkU7e9KdUBVzmuxePzYbe9WLBBhSJoN-Xb-PIsGQU"/>
</div>
</button>
<!-- Call to Action Text -->
<p class="font-label-caps text-label-caps text-secondary uppercase tracking-widest pulse-text opacity-0 translate-y-4 transition-all duration-700 delay-300" id="hero-cta">
                click to discover
            </p>
</div>
</main>
<script>
        // Simple entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const name = document.getElementById('hero-name');
                const logo = document.getElementById('hero-logo');
                const cta = document.getElementById('hero-cta');

                name.classList.remove('translate-y-4', 'opacity-0');
                
                setTimeout(() => {
                    logo.classList.remove('translate-y-4', 'opacity-0');
                }, 150);

                setTimeout(() => {
                    cta.classList.remove('translate-y-4');
                    // Opacity handled by pulse animation class after initial entrance
                }, 300);
            }, 100);
        });
    </script>
</body></html>
