<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes subtle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .float-animation {
            animation: subtle-float 5s ease-in-out infinite;
        }
        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .pulse-text {
            animation: pulse-opacity 3s ease-in-out infinite;
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative w-full px-margin-mobile">
<div class="max-w-screen-sm w-full flex flex-col items-center justify-center text-center space-y-8 z-10">
<!-- Headline -->
<h1 class="text-primary tracking-tight transition-all duration-700 ease-out text-6xl md:text-8xl font-bold" id="hero-name">
            PAOLO CRESTO
        </h1>
<!-- Interactive Logo Button - Perfectly Circular -->
<button aria-label="Enter Interactive CV" class="group relative outline-none focus-visible:ring-4 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface rounded-full transition-all duration-500 hover:scale-105 active:scale-95 float-animation" id="hero-logo" onclick="window.location.href='#explore'">
<!-- Subtle glow effect -->
<div class="absolute inset-0 rounded-full bg-primary-container blur-2xl opacity-0 group-hover:opacity-20 transition-opacity duration-500"></div>
<div class="relative w-48 h-48 md:w-64 md:h-64 rounded-full overflow-hidden border-2 border-surface-container shadow-lg group-hover:shadow-2xl group-hover:border-primary-container transition-all duration-500 bg-surface-container-lowest flex items-center justify-center">
<img alt="Paolo Cresto Logo" class="w-full h-full object-cover transition-all duration-700 ease-in-out group-hover:scale-110" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDRdRV-1mbxlEeDpHBQiWURCRByLu2Gbxf2XkEQ-qQRcFDI4P3SZXFChmORiBF1Wh8A2_5Lb9MUwzYMjl9AoIVW5NLWzkZbdjtNGxntCQGAoTUPmkS9cKy0GclfrJ7T9Si1FPHyHM4xrF-IhKgiczdWudyN4VriRoOOmUYUF_Xla6jdbZiCsQxJ567Oau0Qz1oi2SenskM-mY1WZut3EBAsQSEyxEgY9jmfa2e-owt9U5Aps5HbJk1meQ91ZTn58vUIr3qL0ATViNs">
</div>
</button>
<!-- Call to Action Text -->
<p class="font-label-md text-secondary uppercase tracking-[0.2em] pulse-text opacity-0 transition-all duration-700 delay-300 opacity-100" id="hero-cta">
            click to discover
        </p>
</div>
</main>
<script>
    // Simple entrance animation
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const name = document.getElementById('hero-name');
            const logo = document.getElementById('hero-logo');
            const cta = document.getElementById('hero-cta');

            name.classList.remove('translate-y-4', 'opacity-0');
            
            setTimeout(() => {
                logo.classList.remove('translate-y-4', 'opacity-0');
            }, 200);

            setTimeout(() => {
                cta.classList.remove('translate-y-4');
                cta.classList.add('opacity-100');
            }, 400);
        }, 100);
    });
</script>


</body></html>
