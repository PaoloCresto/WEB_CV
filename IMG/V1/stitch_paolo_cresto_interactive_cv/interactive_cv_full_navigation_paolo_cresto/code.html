    }

    /* Tooltip styling for menu labels */

      top: 110%;

      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.3s ease;

    .radial-item:hover .radial-label {

    }

<!-- JavaScript for Radial Menu Logic -->
<script data-purpose="interaction-logic">
  const menuBtn = document.getElementById('main-cta-button');
  const container = document.getElementById('menu-container');
  const instructionLabel = document.getElementById('instruction-label');
  const items = document.querySelectorAll('.radial-item');
  
  let isOpen = false;

  // Configuration for radial layout
  const radius = window.innerWidth < 768 ? 140 : 200; // Radius in pixels
  const totalItems = items.length;

  // Initialize button positions
  items.forEach((item, index) => {
    const angle = (index / totalItems) * 2 * Math.PI - (Math.PI / 2); // Start from top
    const x = Math.round(Math.cos(angle) * radius);
    const y = Math.round(Math.sin(angle) * radius);
    
    // Set custom CSS properties for translation
    item.style.setProperty('--tw-translate-x', `${x}px`);
    item.style.setProperty('--tw-translate-y', `${y}px`);
    
    // Stagger delay
    item.style.transitionDelay = `${index * 0.05}s`;
  });

  menuBtn.addEventListener('click', () => {
    isOpen = !isOpen;
    
    if (isOpen) {
      container.classList.add('menu-open');
      instructionLabel.innerText = 'explore the menu';
      instructionLabel.classList.remove('animate-pulse-subtle');
    } else {
      container.classList.remove('menu-open');
      instructionLabel.innerText = 'click to discover';
      instructionLabel.classList.add('animate-pulse-subtle');
    }
  });

  // Handle window resize for radius adjustments
  window.addEventListener('resize', () => {
    const newRadius = window.innerWidth < 768 ? 140 : 200;
    items.forEach((item, index) => {
      const angle = (index / totalItems) * 2 * Math.PI - (Math.PI / 2);
      const x = Math.round(Math.cos(angle) * newRadius);
      const y = Math.round(Math.sin(angle) * newRadius);
      item.style.setProperty('--tw-translate-x', `${x}px`);
      item.style.setProperty('--tw-translate-y', `${y}px`);
    });
  });
</script>
