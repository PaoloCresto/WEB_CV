<style data-purpose="layout-styles">
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #6d28d9 0%, #1e1b4b 100%);
    }

    /* Custom button sizing and interaction */
    .hero-logo-button {
      width: clamp(180px, 25vw, 300px);
      height: clamp(180px, 25vw, 300px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .hero-logo-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(249, 115, 22, 0.4);
    }

    /* Animation classes for the menu */
    .menu-item-hidden {
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .menu-item-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Tooltip styling */
    .discover-hint {
      transition: opacity 0.3s ease;
    }
  </style>
</head>

      Click to discover

<!-- Hero Footer: Navigation (Initially Hidden) -->

<!-- JavaScript for interaction feedback -->
<script data-purpose="interaction-logic">
    const ctaButton = document.getElementById('main-cta-button');
    const menuItems = document.querySelectorAll('.menu-item-hidden');
    const clickHint = document.getElementById('click-hint');
    let isOpen = false;

    ctaButton.addEventListener('click', () => {
      isOpen = !isOpen;
      
      menuItems.forEach((item) => {
        if (isOpen) {
          item.classList.add('menu-item-visible');
          clickHint.style.opacity = '0';
        } else {
          item.classList.remove('menu-item-visible');
          clickHint.style.opacity = '';
        }
      });
      
      // Optional: rotate the logo further on click
      const logoImg = ctaButton.querySelector('img');
      if (isOpen) {
        logoImg.style.transform = 'rotate(180deg) scale(0.9)';
      } else {
        logoImg.style.transform = '';
      }
    });
  </script>
</body></html>
